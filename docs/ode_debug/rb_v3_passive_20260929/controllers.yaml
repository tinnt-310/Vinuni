controller_manager:
  ros__parameters:
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    swerve_controller:
      type: swerve_vehicle_control/SwerveDriveController
    update_rate: 100
    use_sim_time: true
swerve_controller:
  ros__parameters:
    cmd_vel_timeout: 0.5
    max_steering_speed: 3.0
    max_wheel_rate: 10.0
    odom_covariance:
      x: 0.03
      y: 0.03
      yaw: 0.02
    publish_tf: true
    singularity_threshold: 0.0001
    twist_covariance:
      x: 0.05
      y: 0.05
      yaw: 0.04
    use_sim_time: true
    wheel_offset_x: 0.005062
    wheel_radius: 0.214671
    wheel_separation_x: 1.1
    wheel_separation_y: 0.58
