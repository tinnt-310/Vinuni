[metadata]
name = fx5u-wheel-controller
version = 1.0.0
description = Safe SLMP 3E PC controller for a four-wheel Mitsubishi FX5U robot
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    pymcprotocol==0.3.0
    PyYAML>=5.4,<7
include_package_data = True

[options.packages.find]
where = src
