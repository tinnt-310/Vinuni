# Fixed FX5U Ladder profile supplied 2026-10-17.
plc:
  ip: 192.168.3.250
  port: 1025
  plc_type: Q
  socket_timeout_s: 0.2
register_mapping_file: registers_mapping.yaml
timing:
  write_rate_hz: 20.0
  trigger_on_s: 0.010
  trigger_off_s: 0.010
  # Trial widths. Enter the measured worst-case PLC scan time when known.
  plc_max_scan_s: null
  scan_margin: 1.5
  command_timeout_s: 0.75
startup:
  servo_ready_wait_s: 0.3
  angle_timeout_s: 5.0
  initial_angle_deg: [90.0, 90.0, 90.0, 90.0]
steering:
  # Provisional previous encoding: verify on PLC before commissioning.
  units_per_degree: 1.0
  raw_zero: 0
  tolerance_deg: 5.0
  stop_error_deg: 45.0
bldc:
  # external: never write Y8. slmp: write Y8 if existing Ladder permits it.
  enable_mode: external
feedback:
  poll_interval_s: 0.1
  max_age_s: 0.3
hall:
  # unknown: raw words only. cumulative_u16 requires verified counters.
  mode: unknown
  wheel_diameter_m: 0.428
  pulses_per_revolution: 25
  window_s: 0.3
  max_speed_m_s: 3.0
